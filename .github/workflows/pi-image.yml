# Builds the Raspberry Pi kiosk image (.img.xz for Raspberry Pi Imager).
# Download it from the run's "Artifacts" section when it finishes.
name: Raspberry Pi image

on:
  workflow_dispatch:
  push:
    paths:
      - 'pi-kiosk/**'
      - '.github/workflows/pi-image.yml'
      # The image carries the app too: a sender or UI release must rebuild it.
      - 'backend/**'
      - '!backend/tests/**'
      - 'frontend/dist/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pi-gen needs ~15 GB; the runner starts with ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Lets the x86 runner execute the arm64 image's programs.
      # arm64 programs must run inside pi-gen's container, so the handler has
      # to be registered with the F (fix-binary) flag -- Ubuntu's
      # qemu-user-binfmt registers a host-only path and arch-test fails.
      # tonistiigi/binfmt registers /usr/bin/qemu-aarch64 with F; qemu-user
      # (without its binfmt package) gives build-docker.sh the qemu-aarch64
      # it looks for, and its interpreter check then matches.
      - name: Install arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          which qemu-aarch64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Pack the bundle
        run: bash pi-kiosk/build-bundle.sh

      - name: Build the image
        env:
          PI_SERVICE_PASSWORD: ${{ secrets.PI_SERVICE_PASSWORD }}
        run: |
          # The "tawfiq" account is for maintenance over SSH (no screen login).
          # Without the PI_SERVICE_PASSWORD secret it gets a random, unknown password.
          PASS="${PI_SERVICE_PASSWORD:-$(openssl rand -base64 24)}"
          echo "::add-mask::$PASS"
          sed -i "s|^FIRST_USER_PASS=.*|FIRST_USER_PASS='$PASS'|" pi-kiosk/image/config
          set -o pipefail
          bash pi-kiosk/image/build-image.sh 2>&1 | tee build-image.log

      # Job annotations are readable without signing in, unlike the raw log:
      # surface the end of the build output there when it fails.
      - name: Report build failure
        if: failure()
        run: |
          for f in build-image.log dist-pi/pi-gen/work/*/build.log dist-pi/pi-gen/deploy/build.log; do
            [ -f "$f" ] || continue
            # One annotation per file (GitHub keeps only 10 per step); %0A = newline.
            msg="$(tail -n 60 "$f" | grep -v '^+ ' | tail -n 40 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=$(basename "$f")::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: OnefinitySender-Raspi-arm64-image
          path: dist-pi/*.img.xz
          compression-level: 0
          retention-days: 14

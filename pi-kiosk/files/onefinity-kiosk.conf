# Onefinity kiosk settings. Reboot (or: sudo systemctl restart onefinity-kiosk)
# after changing.

# Page shown full-screen.
KIOSK_URL=http://localhost:4000

# Screen rotation: normal, 90, 180 or 270. The pendant monitor is mounted
# portrait, so the image ships rotated 90 degrees; use 270 if it comes out
# upside down for your mounting. The UI switches to its tall touch layout by
# itself once the screen is taller than it is wide.
KIOSK_ROTATE=90

# Touchscreen rotation. Rotating the screen does NOT rotate the digitiser, so
# without this a tap lands somewhere other than where the finger is -- taps hit
# the wrong control, or nothing, and the panel feels broken and laggy.
#   auto    follow KIOSK_ROTATE above (correct for almost every panel)
#   normal  leave touch alone -- use this if taps come out mirrored or rotated
#           the wrong way, which means the compositor already transforms them
#           and "auto" is doubling it
#   90/180/270  force a specific transform
KIOSK_TOUCH_TRANSFORM=auto
